server:
  port: 8082

spring:
  application:
    name: email-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: email-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.micomm.email.kafka"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.micomm.email.kafka.EmailSendMessage

micomm:
  jwt:
    secret: "dGhpc2lzYXRlc3RzZWNyZXRrZXlmb3Jqd3RzaWduaW5nMzJieXRlcw=="
    access-token-expiry-minutes: 120
    refresh-token-expiry-days: 7

  email:
    # Recipients per Kafka message; each message is sent by one worker thread.
    send-chunk-size: 500
    # Chunks one instance processes at once.
    consumer-concurrency: 3
    # Emails sent at once within a chunk (per instance: consumer-concurrency x this).
    send-parallelism: 10

  internal:
    api-key: ${INTERNAL_API_KEY:change-me-in-prod}
    tenant-management-base-url: ${TENANT_MGMT_BASE_URL:http://localhost:8081}

  provisioning:
    host: localhost
    port: 5432
    shared-database-name: micomm_platform
    admin-username: postgres
    admin-password: root

kafka:
  topics:
    email-send: email.send.v1
    # Caps how many chunks run at once across all instances; can be raised later, never lowered.
    email-send-partitions: 6
    email-result: email.result.v1

logging:
  level:
    com.micomm.email: INFO
